submission:
  title: "EnergyNex — Grid Load Optimisation & Renewable Energy Performance Advisor"
  problem_statement: >
    The US curtailed ~8 TWh of clean energy in 2023 because the grid could not absorb all available renewable generation. At the same time, unexpected electricity demand spikes cause grid instability. Grid operators lack real-time decision support to balance loads and detect underperforming solar/wind assets.
  solution_summary: >
    EnergyNex (powered by GridOpt AI engine) is an AI energy intelligence & grid operator decision support system that forecasts demand spikes (10.15 GW at 18:00, +16% increase), recommends load-balancing actions (shifting 350 MW industrial demand), detects underperforming solar/wind assets (Solar Farm A -21.7% drop), performs explainable root cause analysis (52% low irradiance, 23% temp), and generates an integrated AI operator brief with a 300 MW curtailment reduction plan.
  key_features:
    - "Grid Load Demand Forecasting (Random Forest ML model predicting 24h load curve & demand spikes)"
    - "AI Load-Balancing Recommendation Engine (350 MW industrial load shifting & charging reduction)"
    - "Renewable Asset Anomaly Detection (Isolation Forest ML flagging underperforming solar/wind farms)"
    - "Explainable AI Root Cause Analysis (SHAP feature attribution per asset)"
    - "Renewable Curtailment Minimisation Plan (Absorbing 300 MW clean energy)"
    - "Interactive Optimisation Scenario Simulator & Integrated AI Operator Brief Generator"
    - "IBM Bob AI Copilot (Data-aware natural language assistant for grid operator queries)"
    - "Executive & Weekly Grid Reliability Reports (Daily, Weekly, Monthly, Yearly regulatory filings)"

