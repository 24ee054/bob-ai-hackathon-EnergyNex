<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G-EnergySense AI | REST API Documentation & Interactive Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
        body { margin: 0; background: #0b1120; font-family: sans-serif; }
        .swagger-ui .topbar { display: none; }
        .swagger-ui { filter: invert(88%) hue-rotate(180deg); }
        .swagger-ui .info { margin: 20px 0; }
        .custom-header {
            background: #0f172a;
            color: #f8fafc;
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="custom-header">
        <div>
            <h1 style="margin:0; font-size:18px; font-weight:bold;">⚡ G-EnergySense AI — Enterprise OpenAPI / Swagger Explorer</h1>
            <p style="margin:4px 0 0 0; font-size:12px; color:#94a3b8;">Gujarat State Load Despatch Centre (SLDC, Gotri, Vadodara) SCADA Integration Interface</p>
        </div>
        <div>
            <a href="/" style="color:#38bdf8; text-decoration:none; font-size:13px; font-weight:600; margin-right:15px;">← Return to Command Portal</a>
            <a href="/admin/" style="color:#a78bfa; text-decoration:none; font-size:13px; font-weight:600;">Admin Console →</a>
        </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script>
        const spec = {
            openapi: "3.0.3",
            info: {
                title: "G-EnergySense AI REST API",
                version: "1.0.0",
                description: "Real-time SCADA telemetry, Isolation Forest anomaly attribution, multi-model demand forecasting, and IBM Bob Copilot tool interface for the Gujarat State Electrical Grid."
            },
            servers: [
                { url: "http://127.0.0.1:8000", description: "Local Development Server" }
            ],
            paths: {
                "/api/v1/grid/live/": {
                    get: {
                        summary: "Live Gujarat State Grid Telemetry",
                        description: "Returns statewide aggregated active demand, renewable generation, net demand, frequency, and 10-district breakdowns.",
                        responses: {
                            "200": {
                                description: "Successful SCADA telemetry snapshot"
                            }
                        }
                    }
                },
                "/api/v1/districts/": {
                    get: {
                        summary: "List Gujarat District Hubs",
                        description: "Retrieves metadata, DISCOM zones (UGVCL, DGVCL, MGVCL, PGVCL), GPS coordinates, and nominal baselines for all 10 monitored hubs.",
                        responses: { "200": { description: "List of districts" } }
                    }
                },
                "/api/v1/anomalies/": {
                    get: {
                        summary: "Query Active Grid Anomalies",
                        description: "Retrieves active feeder surges with physical root-cause attribution (Active Surge, Harmonics THD > 5%, PF Drain, Frequency Sag).",
                        parameters: [
                            { name: "severity", in: "query", schema: { type: "string" }, description: "Filter by CRITICAL, HIGH, or WARNING" }
                        ],
                        responses: { "200": { description: "List of detected anomalies" } }
                    }
                },
                "/api/v1/forecast/": {
                    get: {
                        summary: "Multi-Hour Predictive Load Forecast",
                        description: "Returns 1 to 4 hour forward load projections generated by Random Forest and Gradient Boosting models against the 21,500 MW state peak ceiling.",
                        responses: { "200": { description: "Forecast projection series" } }
                    }
                },
                "/api/v1/directives/": {
                    get: {
                        summary: "SLDC Automated Dispatch Directives",
                        description: "Returns prioritized dispatch orders for regional substation load-balancing.",
                        responses: { "200": { description: "List of active directives" } }
                    }
                },
                "/api/v1/copilot/chat/": {
                    post: {
                        summary: "IBM Bob Autonomous Grid Copilot",
                        description: "Natural language query endpoint for conversational feeder audits and 1-click SLDC executive incident briefs.",
                        requestBody: {
                            required: true,
                            content: {
                                "application/json": {
                                    schema: {
                                        type: "object",
                                        properties: {
                                            query: { type: "string", example: "Audit Anand & Kheda (CHARUSAT Zone)" }
                                        },
                                        required: ["query"]
                                    }
                                }
                            }
                        },
                        responses: {
                            "200": { description: "Copilot analysis and optional markdown incident brief" }
                        }
                    }
                }
            }
        };

        window.ui = SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout"
        });
    </script>
</body>
</html>
